
name: Generate Posit Manifest

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/generate-manifest.yml'

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.1'
          use-public-rspm: true

      - name: Install packages
        run: |
          Rscript -e "install.packages(c('rsconnect', 'shiny', 'httr'))"

      - name: Generate manifest
        run: |
          Rscript -e "rsconnect::writeManifest(appDir = 'frontend', appMode = 'shiny')"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add Posit Connect manifest"
          title: "Add Posit Connect manifest"
          body: "Adds the manifest.json generated for Posit Connect Cloud."
          branch: "add-posit-manifest"
          delete-branch: true
